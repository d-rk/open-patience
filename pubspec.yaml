name: open_patience
description: >-
  Open Patience — a free, open-source solitaire game (Klondike, FreeCell),
  built as a vehicle for clean, testable architecture. Pure-Dart game engine
  (lib/core, lib/persistence) with a Flutter presentation layer.
publish_to: 'none'
version: 1.0.3+5

environment:
  sdk: '>=3.10.0 <4.0.0'
  # Pinned exactly (not a range) so F-Droid's reproducible build can extract
  # and check out the same Flutter version. Bump in lockstep with the CI /
  # F-Droid toolchain when upgrading Flutter.
  flutter: 3.38.5

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  # Bundled Blender-rendered art (splash + main-menu banner). Rendered from
  # tools/art/*.blend via tools/art/build_art.py — never fetched at runtime.
  assets:
    - assets/images/

  # Bundled OFL fonts (see assets/fonts/OFL-*.txt for licenses). Bundled as
  # local assets — never fetched at runtime — so the F-Droid build stays
  # offline and reproducible. Quicksand and Fredoka are variable-weight.
  fonts:
    - family: LilitaOne
      fonts:
        - asset: assets/fonts/LilitaOne-Regular.ttf
    - family: Quicksand
      fonts:
        - asset: assets/fonts/Quicksand-VariableFont_wght.ttf
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka-VariableFont_wght.ttf
    - family: Satisfy
      fonts:
        - asset: assets/fonts/Satisfy-Regular.ttf

# App launcher icons. Source art is rendered in Blender via
# `tools/logo/build_logo.py` (see that file for the regen command).
# Regenerate the platform icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/icon.png"
  android: true
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#2c8e5d"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"

# Startup splash. Source art is rendered in Blender via
# `tools/art/build_art.py` (fanned card spread on transparent film). The
# splash.png sits centered on the felt-dark background. Regenerate the native
# splash assets with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#14532D"
  image: assets/images/splash.png
  android: true
  ios: true
  android_12:
    # Android 12+ clips this to a 768px-diameter circle on the 1152px
    # canvas, so it uses a separate render with the camera pulled back
    # (see tools/art/build_art.py) rather than the full-bleed splash.png.
    image: assets/images/splash_android12.png
    color: "#14532D"
