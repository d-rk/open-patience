name: Release APKs (F-Droid reproducible source)

# On every version tag, build the per-ABI release APKs signed with the app key
# and attach them to a GitHub Release. F-Droid's reproducible-build check
# (`Binaries:` + `AllowedAPKSigningKeys:` in fdroiddata) downloads these and
# compares them, byte-for-byte, against its own from-source build — so this
# job MUST stay in lockstep with the fdroiddata build recipe: same pinned
# Flutter version, same `--flavor production --split-per-abi`, same
# SOURCE_DATE_EPOCH. This is separate from the self-hosted F-Droid repo
# (release.yml), which keeps publishing a universal APK on pushes to main.
#
# A Dart AOT snapshot embeds the absolute source-root path it was compiled
# from — even with --obfuscate — so this build and F-Droid's independent
# from-source build only verify as byte-identical if both build from the same
# absolute path. actions/checkout's default path IS that shared path: GitHub
# Actions always checks out to /home/runner/work/<repo>/<repo>
# (/home/runner/work/open-patience/open-patience here), and the fdroiddata
# recipe's build steps relocate their own checkout to that same path (via a
# `sudo:` mkdir, since only root can create /home/runner there — matching the
# convention real Flutter F-Droid apps like org.lichess.mobileV2 and
# com.viscouspot.gitsync use). So nothing needs relocating on this side.
# Verified locally with tools/fdroid/verify-reproducible-build.sh before
# relying on this in CI. Keep SOURCE_DATE_EPOCH in lockstep with the
# fdroiddata recipe.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release-apks:
    name: Build per-ABI APKs and attach to the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the exact Flutter version — must equal `environment: flutter:` in
      # pubspec.yaml and the version the fdroiddata recipe checks out.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Decode app signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/app-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app-release.keystore
          EOF

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build per-ABI release APKs (reproducible)
        run: |
          # Match fdroiddata's recipe exactly for a byte-identical result.
          export SOURCE_DATE_EPOCH=0
          flutter build apk --release --flavor production --split-per-abi \
            --obfuscate --split-debug-info=build/app/outputs/symbols

      - name: Attach APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=build/app/outputs/flutter-apk
          gh release create "${GITHUB_REF_NAME}" \
            "$out/app-armeabi-v7a-production-release.apk" \
            "$out/app-arm64-v8a-production-release.apk" \
            "$out/app-x86_64-production-release.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Per-ABI release APKs, signed with the app key. Source for F-Droid's reproducible-build verification."
