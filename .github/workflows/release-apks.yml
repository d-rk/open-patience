name: Release APKs (F-Droid reproducible source)

# On every version tag, build the per-ABI release APKs signed with the app key
# and attach them to a GitHub Release. F-Droid's reproducible-build check
# (`Binaries:` + `AllowedAPKSigningKeys:` in fdroiddata) downloads these and
# compares them, byte-for-byte, against its own from-source build — so this
# job MUST stay in lockstep with the fdroiddata build recipe: same pinned
# Flutter version, same `--flavor production --split-per-abi`, same
# SOURCE_DATE_EPOCH (the tagged commit's timestamp). This is separate from the
# self-hosted F-Droid repo (release.yml), which keeps publishing a universal
# APK on pushes to main.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-release-apks:
    name: Build per-ABI APKs and attach to the GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Pin the exact Flutter version — must equal `environment: flutter:` in
      # pubspec.yaml and the version the fdroiddata recipe checks out.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Decode app signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/app-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app-release.keystore
          EOF

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build per-ABI release APKs (reproducible)
        run: |
          # Match fdroiddata's recipe exactly for a byte-identical result.
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct)"
          flutter build apk --release --flavor production --split-per-abi

      - name: Attach APKs to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=build/app/outputs/flutter-apk
          gh release create "${GITHUB_REF_NAME}" \
            "$out/app-armeabi-v7a-production-release.apk" \
            "$out/app-arm64-v8a-production-release.apk" \
            "$out/app-x86_64-production-release.apk" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Per-ABI release APKs, signed with the app key. Source for F-Droid's reproducible-build verification."
