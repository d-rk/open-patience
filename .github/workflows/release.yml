name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  publish-fdroid-repo:
    name: Build, sign, and publish to the self-hosted F-Droid repo
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Decode app signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/app-release.keystore

      - name: Write key.properties
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=app-release.keystore
          EOF

      - name: Build signed release APK
        run: flutter build apk --release --flavor production --build-number="$GITHUB_RUN_NUMBER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install fdroidserver
        run: pip install fdroidserver

      - name: Check out gh-pages into the repo working directory
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: fdroid-repo
          fetch-depth: 0

      - name: Decode repo signing keystore
        env:
          FDROID_KEYSTORE_BASE64: ${{ secrets.FDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$FDROID_KEYSTORE_BASE64" | base64 -d > fdroid-repo/keystore.p12

      - name: Write fdroidserver config.yml
        working-directory: fdroid-repo
        env:
          FDROID_KEYSTORE_PASSWORD: ${{ secrets.FDROID_KEYSTORE_PASSWORD }}
        run: |
          cat > config.yml <<EOF
          repo_url: "https://d-rk.github.io/open-patience/repo"
          repo_name: "d-rk's Open Patience repo"
          repo_description: "Self-hosted F-Droid repo for Open Patience, published automatically from GitHub Actions."
          repo_keyalias: "repokey"
          keystore: "keystore.p12"
          keystorepass: "${FDROID_KEYSTORE_PASSWORD}"
          keypass: "${FDROID_KEYSTORE_PASSWORD}"
          EOF
          chmod 600 config.yml keystore.p12

      - name: Replace the previous APK with the new one
        run: |
          mkdir -p fdroid-repo/repo
          rm -f fdroid-repo/repo/*.apk
          cp build/app/outputs/flutter-apk/app-production-release.apk \
            "fdroid-repo/repo/open-patience-${GITHUB_RUN_NUMBER}.apk"

      - name: Stage F-Droid app metadata (recipe + localized text/graphics)
        run: |
          pkg=io.github.d_rk.openpatience
          mkdir -p "fdroid-repo/metadata/$pkg"
          # App-info recipe (Categories, License, links).
          cp "metadata/$pkg.yml" fdroid-repo/metadata/
          # Localized store listing (title, descriptions, icon, screenshots)
          # lives at the repo root in the F-Droid-standard metadata/<locale>/
          # layout; map each locale dir into the self-hosted collection's
          # metadata/<packageId>/<locale>/ tree that `fdroid update` reads.
          # (Glob the <locale>/ dirs only, so the recipe .yml stays at the top.)
          for locale in metadata/*/; do
            cp -r "$locale" "fdroid-repo/metadata/$pkg/"
          done

      - name: Regenerate the F-Droid repo index
        working-directory: fdroid-repo
        run: fdroid update --create-metadata

      - name: Publish updated repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: fdroid-repo
          publish_branch: gh-pages
          # Flatten gh-pages to a single orphan commit each release. Without
          # this, every release keeps the previous APK blob in git history
          # forever (the working tree is lean, but .git grows ~one APK per
          # release and fetch-depth:0 re-fetches it all each time).
          force_orphan: true
          # keep_files defaults to false: mirror fdroid-repo exactly. We
          # already start from a full checkout of gh-pages and mutate it
          # locally (delete the old APK, add the new one, regenerate the
          # index), so the destination should match our tree exactly —
          # keep_files: true would instead re-clone gh-pages separately
          # and overlay our tree on top, silently un-deleting the old APK.
          exclude_assets: 'keystore.p12,config.yml'
